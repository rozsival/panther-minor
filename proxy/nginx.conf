# -- Nginx proxy ----------------------------------------------------------------
# Plain HTTP, one listener per service port. TLS ends in the ts-proxy sidecar,
# which forwards each tailnet port to the listener of the same port here;
# host-local clients and SSH tunnels reach these listeners on 127.0.0.1.
#
# Private services only: public ones run their own Tailscale sidecar outside
# this stack; see docs/networking.md#-public-services.
user nginx;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log notice;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 2400M;
  sendfile on;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # The scheme the client used: ts-proxy sets X-Forwarded-Proto to https, while
  # this listener's own $scheme is always http. Loopback clients send none.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  # Llama.cpp
  server {
    listen 8000;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;

      proxy_read_timeout 900;
      proxy_connect_timeout 900;
      proxy_send_timeout 900;

      proxy_pass http://llama-manager:8000;
    }
  }

  # stable-diffusion.cpp (image generation)
  server {
    listen 8001;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;

      proxy_read_timeout 900;
      proxy_connect_timeout 900;
      proxy_send_timeout 900;

      proxy_pass http://sd-manager:8000;
    }
  }

  # Open-WebUI
  server {
    listen 8080;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_pass http://open-webui:8080;
    }
  }

  # Grafana
  upstream grafana {
    server grafana:3000;
  }

  server {
    listen 3000;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;

      proxy_pass http://grafana;
    }
  }

  # Prometheus
  server {
    listen 9090;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_pass http://prometheus:9090;
    }
  }
}
