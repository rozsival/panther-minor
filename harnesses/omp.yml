providers:
  panther-minor:
    baseUrl: https://<domain>:8000/v1
    apiKey: llama-cpp
    api: openai-completions
    compat:
      streamIdleTimeoutMs: 600000
      # Thinking is a per-request switch on the llama.cpp chat template, so one
      # model id serves both modes: `chat_template_kwargs.enable_thinking` is
      # flipped by the thinking toggle (Shift+Tab) instead of switching models.
      thinkingFormat: qwen-chat-template
      reasoningContentField: reasoning_content
    models:
      - id: Qwen3.8-27B
        name: Qwen3.8-27B
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        maxTokens: 65536
        compat:
          # Qwen3.8 documents a tighter sampler plus a presence penalty without
          # thinking, and a wider one with it.
          extraBody:
            presence_penalty: 1.5
            temperature: 0.7
            top_p: 0.8
          whenThinking:
            extraBody:
              presence_penalty: 0.0
              temperature: 1.0
              top_p: 0.95
          # OMP routes the thinking level onto `chat_template_kwargs.reasoning_effort`
          # for Qwen 3.8+ ids, but the template accepts only low | medium | xhigh and
          # raises on anything else — clamp the two levels that would 500.
          reasoningEffortMap:
            minimal: low
            max: xhigh
      - id: Qwen3.6-35B-A3B
        name: Qwen3.6-35B-A3B
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        maxTokens: 65536
        compat:
          extraBody:
            presence_penalty: 1.5
            temperature: 1.0
          whenThinking:
            extraBody:
              presence_penalty: 0.0
              temperature: 0.6
      - id: Qwen3.5-2B
        name: Qwen3.5-2B
        reasoning: true
        input: [text, image]
        contextWindow: 32768
        maxTokens: 8192
      - id: DeepSeek-V4-Flash-0731
        name: DeepSeek-V4-Flash-0731
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 65536
