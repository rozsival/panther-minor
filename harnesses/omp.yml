providers:
  panther-minor:
    baseUrl: https://<domain>:8000/v1
    apiKey: llama-cpp
    api: openai-completions
    compat:
      streamIdleTimeoutMs: 600000
      # Thinking is a per-request switch on the llama.cpp chat template, so one
      # model id serves both modes: `chat_template_kwargs.enable_thinking` is
      # flipped by the thinking toggle (Shift+Tab) instead of switching models.
      thinkingFormat: qwen-chat-template
      reasoningContentField: reasoning_content
    models:
      - id: Qwen3.8-27B
        name: Qwen3.8-27B
        reasoning: true
        input: [text, image]
        # llama.cpp decodes images with stb_image (`stbi_load_from_memory` in
        # tools/mtmd/mtmd-helper.cpp), which has no WebP support — a WebP data
        # URL fails with 400 "Failed to load image or audio file". OMP's image
        # pipeline picks the smallest of PNG/JPEG/WebP, so screenshots often
        # land on WebP. This flag is auto-set for discovered llama.cpp servers
        # but must be declared for a hand-written provider; it forces PNG/JPEG
        # encoding and transcodes WebP already in the history.
        imageInputDecoder: stb
        contextWindow: 262144
        maxTokens: 65536
        # The template accepts only low | medium | xhigh on
        # `chat_template_kwargs.reasoning_effort` and raises on anything else, so
        # declare that ladder instead of remapping: OMP then sends the selected
        # level verbatim and clamps anything outside it to the nearest member.
        # `requiresEffort: false` keeps `off` as a real `enable_thinking: false`
        # instead of clamping it to the lowest effort.
        thinking:
          mode: effort
          efforts: [low, medium, xhigh]
          requiresEffort: false
        compat:
          # Qwen3.8 documents a tighter sampler plus a presence penalty without
          # thinking, and a wider one with it.
          extraBody:
            presence_penalty: 1.5
            temperature: 0.7
            top_p: 0.8
          whenThinking:
            extraBody:
              presence_penalty: 0.0
              temperature: 1.0
              top_p: 0.95
      - id: Qwen3.6-35B-A3B
        name: Qwen3.6-35B-A3B
        reasoning: true
        input: [text, image]
        imageInputDecoder: stb
        contextWindow: 262144
        maxTokens: 65536
        # Reasoning on these two is a plain on/off switch: `reasoning_effort` is
        # never sent (OMP only routes it onto the chat template for Qwen 3.8+ ids)
        # and the template has no effort branch anyway. Collapse the ladder to a
        # single level so the toggle cycles off/on instead of four identical ones.
        thinking:
          mode: effort
          efforts: [medium]
        compat:
          extraBody:
            presence_penalty: 1.5
            temperature: 1.0
          whenThinking:
            extraBody:
              presence_penalty: 0.0
              temperature: 0.6
      - id: Qwen3.5-2B
        name: Qwen3.5-2B
        reasoning: true
        input: [text, image]
        imageInputDecoder: stb
        contextWindow: 32768
        maxTokens: 8192
        thinking:
          mode: effort
          efforts: [medium]
      - id: DeepSeek-V4-Flash-0731
        name: DeepSeek-V4-Flash-0731
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 65536
        # The built-in DeepSeek policy owns the ladder (low | medium | xhigh) and
        # marks effort mandatory, which turns `off` into the lowest effort with
        # thinking still on. Restating the ladder with `requiresEffort: false` is what
        # makes `off` emit a real `enable_thinking: false`.
        thinking:
          mode: effort
          efforts: [low, medium, xhigh]
          requiresEffort: false
        compat:
          # DeepSeek-V4 exposes three modes: non-think, Think High, Think Max. Effort
          # routing is auto-detected only for Qwen 3.8+ ids, so force it on here; the
          # template reads the same `chat_template_kwargs.reasoning_effort` kwarg.
          qwenTemplateReasoningEffort: true
          # Only `high` and `max` inject an effort preamble - every other value is
          # silently ignored (no exception, unlike Qwen3.8), leaving plain thinking. A
          # model-level `thinking` block does not stick on this id (the built-in
          # DeepSeek policy wins), so the ladder is fixed at low | medium | xhigh and
          # the map is the only way to reach all three template modes.
          reasoningEffortMap:
            low: none
            medium: high
            xhigh: max
          # With tools present the template keeps the reasoning of every assistant turn
          # and always opens a `<think>` block, so a missing `reasoning_content` would
          # replay empty ones.
          requiresReasoningContentForToolCalls: true
