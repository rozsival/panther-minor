name: panther-minor
help: '🐆 Panther Minor CLI'
version: 12.0.1

commands:
  - name: setup
    help: Configure the Panther Minor host
    commands:
      - name: all
        help: Run the full workstation setup
        default: force
        flags:
          - long: --server-name
            short: -n
            arg: name
            help: Server name for logs and Git config (defaults to host name)
          - long: --allowed-user
            short: -u
            arg: user
            help: User to configure for host access and tooling (defaults to current user)
          - long: --ssh-port
            short: -p
            arg: port
            help: SSH port to configure (defaults to 2222)
            validate: port
          - long: --timezone
            short: -t
            arg: timezone
            help: System timezone to configure (defaults to Europe/Prague)
          - long: --lvm-device
            short: -d
            arg: path
            help: Logical volume device to extend (defaults to /dev/ubuntu-vg/ubuntu-lv)
        environment_variables:
          - name: panther_server_name
            help: Default server name for setup commands
          - name: panther_allowed_user
            help: Default user for setup commands
          - name: panther_ssh_port
            help: Default SSH port for setup commands
            validate: port
          - name: panther_timezone
            help: Default timezone for setup init
          - name: panther_lvm_device
            help: Default logical volume device for setup init

      - name: init
        help: Extend storage and set timezone
        flags:
          - long: --timezone
            short: -t
            arg: timezone
            help: System timezone to configure (defaults to Europe/Prague)
          - long: --lvm-device
            short: -d
            arg: path
            help: Logical volume device to extend (defaults to /dev/ubuntu-vg/ubuntu-lv)
        environment_variables:
          - name: panther_timezone
            help: Default timezone for setup init
          - name: panther_lvm_device
            help: Default logical volume device for setup init

      - name: packages
        help: Install essential packages

      - name: brew
        help: Install Homebrew, llmfit, and Hugging Face CLI
        flags:
          - long: --allowed-user
            short: -u
            arg: user
            help: User to configure for Homebrew and shell integration
        environment_variables:
          - name: panther_allowed_user
            help: Default user for setup commands

      - name: docker
        help: Install Docker and add the selected user to the docker group
        flags:
          - long: --allowed-user
            short: -u
            arg: user
            help: User to add to the docker group
        environment_variables:
          - name: panther_allowed_user
            help: Default user for setup commands

      - name: tailscale
        help: Install Tailscale

      - name: ssh
        help: Harden SSH configuration
        flags:
          - long: --allowed-user
            short: -u
            arg: user
            help: User to allow in SSH
          - long: --ssh-port
            short: -p
            arg: port
            help: SSH port to configure (defaults to 2222)
            validate: port
        environment_variables:
          - name: panther_allowed_user
            help: Default user for setup commands
          - name: panther_ssh_port
            help: Default SSH port for setup commands
            validate: port

      - name: ufw
        help: Configure the firewall
        flags:
          - long: --ssh-port
            short: -p
            arg: port
            help: SSH port to allow through UFW (defaults to 2222)
            validate: port
        environment_variables:
          - name: panther_ssh_port
            help: Default SSH port for setup commands
            validate: port

      - name: fail2ban
        help: Install and configure fail2ban
        flags:
          - long: --ssh-port
            short: -p
            arg: port
            help: SSH port to protect (defaults to 2222)
            validate: port
        environment_variables:
          - name: panther_ssh_port
            help: Default SSH port for setup commands
            validate: port

      - name: amdgpu
        help: Install AMD GPU drivers and ROCm
      - name: grub
        help: Update GRUB kernel parameters

      - name: git
        help: Configure Git defaults for the selected user
        flags:
          - long: --server-name
            short: -n
            arg: name
            help: Server name for Git identity (defaults to host name)
          - long: --allowed-user
            short: -u
            arg: user
            help: User to configure for Git
        environment_variables:
          - name: panther_server_name
            help: Default server name for setup commands
          - name: panther_allowed_user
            help: Default user for setup commands

      - name: shell
        help: Install Starship, configure the shell and put panther-minor on the PATH for the selected user
        flags:
          - long: --allowed-user
            short: -u
            arg: user
            help: User to configure for shell integration
        environment_variables:
          - name: panther_allowed_user
            help: Default user for setup commands

      - name: env
        help: Create .env and sync GPU group IDs
        flags:
          - long: --allowed-user
            short: -u
            arg: user
            help: User that should own the generated .env file
        environment_variables:
          - name: panther_allowed_user
            help: Default user for setup commands

  - name: models
    help: Manage Panther Minor model files
    commands:
      - name: llm
        help: Manage large language models
        commands:
          - name: download
            help: Download a supported LLM into the local Hugging Face cache
            args:
              - name: model
                required: true
                help: Model name from models/llm.config.json
                validate: supported_llm
                completions:
                  dynamic:
                    - panther_complete_llm_models
            flags:
              - long: --force
                short: -f
                help: Re-download even if the model's files already exist
            environment_variables:
              - name: hf_token
                help: Hugging Face token used by hf download
            examples:
              - panther-minor models llm download Qwen3.5-35B-A3B
              - HF_TOKEN=token panther-minor models llm download Qwen3.5-35B-A3B

          - name: list
            help: List supported LLMs

          - name: remove
            help: Remove a downloaded LLM from the local Hugging Face cache
            args:
              - name: model
                required: true
                help: Model name from models/llm.config.json
                validate: supported_llm
                completions:
                  dynamic:
                    - panther_complete_llm_models

          - name: load
            help: Load an LLM into the llama.cpp server
            args:
              - name: model
                required: true
                help: Preset name from llama-cpp/preset.ini
                validate: loadable_llm
                completions:
                  dynamic:
                    - panther_complete_llm_presets
            examples:
              - panther-minor models llm load Qwen3.8-Flash-Next

          - name: unload
            help: Unload an LLM from the llama.cpp server
            args:
              - name: model
                required: true
                help: Preset name from llama-cpp/preset.ini
                validate: loadable_llm
                completions:
                  dynamic:
                    - panther_complete_llm_presets
            examples:
              - panther-minor models llm unload Qwen3.8-Flash-Next

          - name: bench
            help: Measure decode and prefill throughput and append it to the baseline log
            args:
              - name: model
                required: true
                help: Preset name from llama-cpp/preset.ini
                validate: loadable_llm
                completions:
                  dynamic:
                    - panther_complete_llm_presets
            flags:
              - long: --tokens
                short: -n
                arg: count
                help: Tokens to predict per run (defaults to 256)
                validate: integer
              - long: --runs
                short: -r
                arg: count
                help: Measured runs per load, after the warm-ups (defaults to 3)
                validate: integer
              - long: --warmups
                short: -w
                arg: count
                help: Discarded warm-up runs per load; throughput ramps for ~7 (defaults to 8)
                validate: integer
              - long: --loads
                short: -L
                arg: count
                help: Fresh llama-cpp loads to measure; reports median of per-load medians (defaults to 1)
                validate: integer
              - long: --log-path
                short: -l
                arg: path
                help: File to append the baseline to (defaults to models/bench.log)
            examples:
              - panther-minor models llm bench Qwen3.8-27B
              - panther-minor models llm bench --loads 3 --tokens 512 Qwen3.8-Flash-Next

      - name: t2i
        help: Manage text-to-image models
        commands:
          - name: download
            help: Download a supported text-to-image model into the local Hugging Face cache
            args:
              - name: model
                required: true
                help: Model name from models/t2i.config.json
                validate: supported_t2i
                completions:
                  dynamic:
                    - panther_complete_t2i_models
            flags:
              - long: --force
                short: -f
                help: Re-download even if the component files already exist
            environment_variables:
              - name: hf_token
                help: Hugging Face token used by hf download
            examples:
              - panther-minor models t2i download Ideogram-4
              - HF_TOKEN=token panther-minor models t2i download Ideogram-4

          - name: list
            help: List supported text-to-image models

          - name: remove
            help: Remove a downloaded text-to-image model from the local Hugging Face cache
            args:
              - name: model
                required: true
                help: Model name from models/t2i.config.json
                validate: supported_t2i
                completions:
                  dynamic:
                    - panther_complete_t2i_models

          - name: load
            help: Load a text-to-image model into sd-server (replaces the currently loaded one)
            args:
              - name: model
                required: true
                help: Model name from models/t2i.config.json
                validate: supported_t2i
                completions:
                  dynamic:
                    - panther_complete_t2i_models
            flags:
              - long: --exclusive
                short: -e
                help: Dedicate the image GPU(s) to sd-server by moving the LLMs off them (restarts llama.cpp; undo with unload)
            examples:
              - panther-minor models t2i load Qwen-Image-2.1
              - panther-minor models t2i load --exclusive Qwen-Image-2.1

          - name: unload
            help: Unload the text-to-image model by stopping sd-server (returns dedicated GPUs to the LLMs)

      - name: prune
        help: Delete cached model files no config references anymore

  - name: proxy
    help: Manage proxy SSL and certificate automation
    commands:
      - name: certbot
        help: Issue and install the proxy certificate with acme-dns
        flags:
          - long: --domain
            short: -d
            arg: domain
            help: Domain name to issue the certificate for
            required: true
          - long: --challenge-record
            short: -c
            arg: record
            help: ACME challenge CNAME record to create
            required: true
          - long: --force
            short: -f
            help: Re-register acme-dns credentials even if they already exist

      - name: renew-ssl
        help: Renew existing proxy certificates and reload nginx
      - name: setup-cron
        help: Install a cron entry that renews proxy certificates daily
        flags:
          - long: --schedule
            short: -s
            arg: cron
            help: Cron schedule to install (defaults to 0 2 * * *)
          - long: --user
            short: -u
            arg: user
            help: User whose crontab should receive the renewal entry (defaults to current user)
          - long: --log-path
            short: -l
            arg: path
            help: File to append renewal logs to (defaults to proxy/renew-ssl.log)

  - name: cluster
    help: Manage the Panther Minor Docker Compose cluster
    commands:
      - name: start
        help: Start the cluster
        args:
          - name: service
            required: false
            help: Start only specific service(s); repeat the flag to pass multiple services
            validate: cluster_service
            repeatable: true
            completions:
              dynamic:
                - panther_complete_services
        flags:
          - long: --remove-orphans
            short: -r
            help: Remove containers for services not defined in the current configuration

      - name: status
        help: Show the status of cluster containers

      - name: stop
        help: Stop the cluster
        args:
          - name: service
            required: false
            help: Stop only specific service(s); repeat the argument to pass multiple services
            validate: cluster_service
            repeatable: true
            completions:
              dynamic:
                - panther_complete_services
        flags:
          - long: --volumes
            short: -v
            help: Remove named volumes when stopping the cluster

      - name: cleanup
        help: Remove cluster containers, volumes, images, and orphans

      - name: restart
        help: Restart the cluster
        args:
          - name: service
            required: false
            help: Restart only specific service(s); repeat the argument to pass multiple services
            validate: cluster_service
            repeatable: true
            completions:
              dynamic:
                - panther_complete_services
        flags:
          - long: --remove-orphans
            short: -r
            help: Remove containers for services not defined in the current configuration
          - long: --volumes
            short: -v
            help: Remove named volumes when restarting the cluster

      - name: build
        help: Build cluster images
        args:
          - name: service
            required: false
            help: Build only specific service(s); repeat the argument to pass multiple services
            validate: cluster_service
            repeatable: true
            completions:
              dynamic:
                - panther_complete_services
        flags:
          - long: --no-cache
            short: -n
            help: Build images without using the Docker cache

  - name: logs
    help: Stream logs by default or show a one-time tail for cluster services
    args:
      - name: service
        required: true
        help: Service to show logs for
        validate: cluster_service
        repeatable: false
        completions:
          dynamic:
            - panther_complete_services
    flags:
      - long: --tail
        short: -t
        arg: lines
        help: Show a one-time tail snapshot for the number of lines specified instead of streaming logs
        validate: integer

  - name: update
    help: Update the repository from upstream

  - name: install
    help: |-
      Put panther-minor on your PATH, with bash completion

      Symlinks ~/.local/bin/panther-minor onto this checkout's bin/panther-minor and
      writes ~/.local/share/bash-completion/completions/panther-minor, which
      bash-completion lazy-loads. Idempotent; then checks that a fresh login shell
      finds both. Run it as yourself, not with sudo; 'setup shell' runs it for the
      allowed user.
    examples:
      - ./bin/panther-minor install

  - name: completions
    help: Print the shell completion script for eval
    args:
      - name: shell
        help: Shell to generate completions for
        allowed: [bash, zsh]
        default: bash
