# The 26.82 GiB n-gram table is a single `per_layer_token_embd` tensor read host-side through
# `ggml_get_rows`, so it never enters VRAM. That plus the CPU-side experts is ~60 GiB of host memory.
# NOTE: `none` means "no special loading mode", NOT a read-in - mmap stays on either way (46 GiB of
# the process is file-backed, measured). It is still the right value: `mlock` measured 45-47 t/s
# against 68.6 for `none`.
load-mode = none
min-p = 0.0
# Blocks 0-27 keep their routed experts in RAM. Four blocks more than the 24 this ran at before MTP:
# the draft head has to fit on GPU 1, and 4 x 1.465 GiB of expert weights is what buys the room.
# Measured downward: 26 is no faster and eats GPU 0's spare (0.4 GiB left, and GPU 0 is the image-gen
# card), 24 fails to load. Decode is host-CPU-bound here, not PCIe-bound - the GPUs idle at 14-36%
# busy while 11.8 of 12 cores are pegged - so moving experts back to VRAM buys nothing.
n-cpu-moe = 28
n-gpu-layers = 99
presence-penalty = 0.0
reasoning = auto
reasoning-effort = medium
reasoning-preserve = off
repeat-penalty = 1.0
# 2.58 GiB draft head, loaded as a separate model. `shared-` means it carries no `token_embd` or
# `output.weight` and borrows the target's, saving 1.27 GiB; the loader takes a raw pointer into the
# target's tensor map, so the head must land on whichever card holds `output.weight` - GPU 1, the
# last slot of the split. Q8_0 over Q4_K_M: 2 points more acceptance, and a draft step is dominated
# by the output projection, which is cheaper at 8 bits than at 4. Requires the pinned fork build
# (see .env.example) - mainline silently ignores this key.
spec-draft-model = /home/llama-cpp/.cache/huggingface/hub/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
# Depth 2. Depth 3 wins only under greedy benchmarking (57.4 vs 46.1 t/s median over 10 loads each);
# at the production sampler this preset actually serves (temp 1.0, top-k 20, top-p 0.95) it is a wash
# - 25.2 vs 25.4 t/s over 3 loads each, because depth 3 issues ~20% more drafts (2611 vs 2152) at
# lower acceptance (56% vs 59%) and the two cancel. Confirmed in real coding-harness use on
# Qwen3.8-27B as well. Benchmark at the sampler you serve, not at temp 0.
spec-draft-n-max = 2
spec-draft-ngl = all
spec-type = draft-mtp
split-mode = layer
# `tensor-split` divides by LAYER COUNT, and `n-cpu-moe` leaves the first 28 layers nearly
# weightless, so an even-looking split lands almost every heavy block on one card - 52,48 put 22
# heavy blocks plus the output head on GPU 1 and OOMed. 78,22 gives GPU 0 layers 0-38 (28 light +
# 11 heavy) and GPU 1 layers 39-47, the output head and the draft head. GPU 1 stays the lighter
# side because it also hosts the embedding model and Qwen3.5-2B, which pin `main-gpu = 1` and cost
# ~6 GiB whenever they are resident. Leaves ~2.4 GiB spare on GPU 0 and ~1.5 GiB on GPU 1.
tensor-split = 78,22
temp = 1.0
top-k = 20
top-p = 0.95
