# The 26.82 GiB n-gram table is a single `per_layer_token_embd` tensor read host-side through
# `ggml_get_rows`, so it never enters VRAM. That plus the CPU-side experts is ~60 GiB of host memory.
# NOTE: `none` means "no special loading mode", NOT a read-in - mmap stays on either way (46 GiB of
# the process is file-backed, measured). It is still the right value: `mlock` measured 45-47 t/s
# against 68.6 for `none`.
load-mode = none
min-p = 0.0
# Blocks 0-26 keep their routed experts in RAM, 1.465 GiB of expert weights each. History: 24 before
# MTP, 28 to fit the fork's shared draft head on GPU 1, 29 for the self-contained head (+1.26 GiB) so
# block 28's experts freed GPU 0 to take block 39 off GPU 1 - see `tensor-split`. At 29 on upstream
# v0.6.0, Grafana showed ~+100 t/s prefill and ~+5 t/s decode over the fork at 28, and GPU 0 still
# had ~4.2 GiB spare with no other tenant (side kicks and sd-server all pin GPU 1). 27 spends 2.93
# GiB of that on blocks 27-28, both on GPU 0, leaving ~1.3 GiB; GPU 1 is untouched. Predicted
# -3.2 ms/pass (~3%) - inside single-load spread, so not yet measured against 29 with `--loads 3`.
# Measured cost model over ncmoe 28-40 at the 78,22 split: ms/pass = 54.0 + 1.60 * ncmoe (R2 = 0.975).
# The 1.60 ms/block slope equals what those experts cost to stream at the measured 45.3 GiB/s DRAM
# ceiling, so there is no per-block handoff overhead to win back, and only that slope term is
# bandwidth-exposed - faster DRAM is capped at ~7.5% end to end. The 54 ms intercept is the batch-3
# fit extrapolated to ncmoe 0; do not confuse it with the 54.6 ms a bare batch-1 pass costs at
# ncmoe 28 (`spec-type = none`), which still includes 28 blocks of streaming. Decode is
# host-CPU/DRAM-bound, not PCIe-bound: experts are computed on the CPU and never cross the bus, and
# each card has a dedicated Gen5 x8 anyway. Lowering to 24 (with `tensor-split = 72,28`) does return
# the predicted ~6 ms/pass (median 86.5 vs 91.9), but the 5.86 GiB it needs is exactly the
# co-tenants' VRAM: it costs Qwen3.5-2B 146 -> 20 t/s, embeddings 28 -> 670 ms, and Flash-Next itself
# 17.9 -> 13.5 t/s whenever a co-tenant is active. Rejected - and the 6% is inside single-load mode
# spread anyway. Upward is the cheap direction if VRAM is ever needed.
n-cpu-moe = 27
n-gpu-layers = 99
presence-penalty = 0.0
reasoning = auto
reasoning-effort = medium
reasoning-preserve = off
repeat-penalty = 1.0
# 3.85 GiB draft head, loaded as a separate model. Self-contained: it carries its own `token_embd`
# and `output.weight`. The 1.27 GiB smaller `shared-` variants borrowed the target's, but upstream
# cannot load them (`token_embd.weight not found`) - that borrowing only ever existed in the
# unslothai/llama.cpp#144 fork. Unsloth re-cut the self-contained heads for upstream on 2026-10-05;
# older downloads of this file predate that and need re-fetching. Q8_0 over Q4_K_M: 2 points more
# acceptance, and a draft step is dominated by the output projection, which is cheaper at 8 bits.
spec-draft-model = /home/llama-cpp/.cache/huggingface/hub/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
# Depth 2. Depth 3 wins only under greedy benchmarking (57.4 vs 46.1 t/s median over 10 loads each);
# at the production sampler this preset actually serves (temp 1.0, top-k 20, top-p 0.95) it does not.
# Compare depths structurally rather than on t/s, which acceptance noise swamps (35-75% between
# otherwise identical runs): over 6 runs on one load each, depth 3 cost +19.8% per pass (113.3 vs
# 94.6 ms) to settle only +9.9% more tokens per pass (2.45 vs 2.23). Measured cleanly: +18.7 ms/pass
# per extra depth step, being one more batch-1 draft forward plus one more verify token of expert
# streaming - the split between those two is estimated, not measured. Treat the -8% as indicative,
# not decisive: it is one load per arm, inside the per-process mode spread this repo warns about, and
# an earlier 3-load comparison put depth 2 vs 3 at a wash (25.2 vs 25.4 t/s). Depth 4 was also a
# single-load result (-7% t/s), sitting at the bottom of the observed acceptance range rather than
# clearly below it. Benchmark at the sampler you serve, not at temp 0.
spec-draft-n-max = 2
spec-draft-ngl = all
spec-type = draft-mtp
split-mode = layer
# `tensor-split` divides by LAYER COUNT (49 slots: 48 blocks + output), and `n-cpu-moe` leaves the
# first 27 layers nearly weightless, so an even-looking split lands almost every heavy block on one
# card - 52,48 put 22 heavy blocks plus the output head on GPU 1 and OOMed. 80,20 gives GPU 0 layers
# 0-39 (27 light + 13 heavy; 39/49 < 0.80 <= 40/49) and GPU 1 layers 40-47, the output head and the
# draft head. GPU 1 stays the lighter side because it also hosts the embedding model and
# Qwen3.5-2B, which pin `main-gpu = 1` and cost ~6 GiB whenever they are resident. Measured at
# n-cpu-moe 29 with the self-contained head: GPU 0 at 27.7 GiB used (~4.2 GiB spare), GPU 1 at
# 0.8 GiB spare with both co-tenants resident and no slowdown on any of the three. If GPU 1 ever runs
# short, 82,18 moves block 40 to GPU 0 (40/49 < 0.82) for ~1.6 GiB - but at n-cpu-moe 27 GPU 0 has
# no room for it, so pair it with n-cpu-moe 28.
tensor-split = 80,20
temp = 1.0
top-k = 20
top-p = 0.95
