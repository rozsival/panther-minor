# The 26.82 GiB n-gram table is a single `per_layer_token_embd` tensor read host-side through
# `ggml_get_rows`, so it never enters VRAM. That plus the CPU-side experts is ~60 GiB of host memory;
# llama.cpp warns that mmap'd CPU tensor overrides are slower, and the box has 176 GiB free, so read
# them in rather than faulting them through the page cache.
load-mode = none
min-p = 0.0
# Blocks 0-23 keep their routed experts in RAM. 40.9 GiB stays resident and decode streams ~0.70 GiB
# per token (10 of 512 experts per block) over PCIe.
n-cpu-moe = 24
n-gpu-layers = 99
presence-penalty = 0.0
reasoning = auto
reasoning-effort = medium
reasoning-preserve = off
repeat-penalty = 1.0
# The model has a 4B MTP head, but llama.cpp master drops it at conversion (support is open in
# ggml-org/llama.cpp#27836) and no published GGUF carries it. See models/README.md before enabling.
spec-draft-n-max = 0
spec-type = none
split-mode = layer
# `tensor-split` divides by LAYER COUNT, and `n-cpu-moe` leaves the first 24 layers nearly weightless,
# so an even-looking split lands almost every heavy block on one card - 52,48 put 22 heavy blocks plus
# the output head on GPU 1 and OOMed. 72,28 gives GPU 0 layers 0-35 (24 light + 12 heavy) and GPU 1
# layers 36-47 plus the output head. GPU 1 stays the lighter side because it also hosts the embedding
# model and Qwen3.5-2B, which pin `main-gpu = 1` and cost ~6 GiB whenever they are resident.
tensor-split = 72,28
temp = 1.0
top-k = 20
top-p = 0.95
