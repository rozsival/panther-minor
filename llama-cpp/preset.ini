# The 26.82 GiB n-gram table is a single `per_layer_token_embd` tensor read host-side through
# `ggml_get_rows`, so it never enters VRAM. That plus the CPU-side experts is ~60 GiB of host memory.
# NOTE: `none` means "no special loading mode", NOT a read-in - mmap stays on either way (46 GiB of
# the process is file-backed, measured). It is still the right value: `mlock` measured 45-47 t/s
# against 68.6 for `none`.
load-mode = none
min-p = 0.0
# Blocks 0-39 - every block on GPU 0 - keep their routed experts in RAM (1.465 GiB each), and
# `moe-cache-mib` gives the VRAM that frees to an LRU cache of those experts (llama.cpp v0.7.0+,
# ggml-org/llama.cpp#29887): batches of <= 32 tokens run the host-expert layers on GPU 0 and upload
# only the missed experts over PCIe. The cache lands only on the GPU that owns the host-expert layers,
# so all of it sits on GPU 0 and GPU 1 is untouched. `split-mode = tensor` is refused with a cache.
# Measured on v0.7.0 with MTP only (`--spec-default` ngram off), `bench --loads 3`, spread 0%:
#   n-cpu-moe 27, no cache         28.3 t/s decode, 345 t/s prefill (previous production)
#   n-cpu-moe 27, cache  1024 MiB  21.0 t/s decode, 339 t/s prefill (~2.5% of host experts)
#   n-cpu-moe 31, cache  6656 MiB  32.2 t/s decode, 322 t/s prefill
#   n-cpu-moe 40, cache 18432 MiB  42.3 t/s decode, 296 t/s prefill
#   n-cpu-moe 40, cache 20480 MiB  45.0 t/s decode, 310 t/s prefill
# A small cache misses too often and loses to the CPU path; it pays once it holds a large share of the
# host experts. 18432 over 20480 buys headroom: it leaves GPU 0 ~2.6 GB free (20480 left ~0.5 GB)
# for 6% less decode. GPU 0 must stay Flash-Next's alone - side kicks and sd-server pin GPU 1, and
# Qwen3.5-2B's projector needs `mmproj-device`. When anything else allocates on a full GPU 0, amdgpu
# does not fail it but evicts Flash-Next's VRAM to system RAM: Qwen3.5-2B's projector there cut
# decode 40 -> 4 t/s and prefill 495 -> 52 t/s. An 85K-token prompt ran clean (462 t/s prefill,
# 31.5 t/s decode).
# Before the cache, the CPU path cost ms/pass = 54.0 + 1.60 * n-cpu-moe (R2 = 0.975 over 28-40 at
# 78,22): the slope is those experts' streaming cost at the measured 45.3 GiB/s DRAM ceiling.
moe-cache-mib = 18432
n-cpu-moe = 40
n-gpu-layers = 99
presence-penalty = 0.0
reasoning = auto
reasoning-effort = medium
reasoning-preserve = off
repeat-penalty = 1.0
# 3.85 GiB draft head, loaded as a separate model. Self-contained: it carries its own `token_embd`
# and `output.weight`. The 1.27 GiB smaller `shared-` variants borrowed the target's, but upstream
# cannot load them (`token_embd.weight not found`) - that borrowing only ever existed in the
# unslothai/llama.cpp#144 fork. Unsloth re-cut the self-contained heads for upstream on 2026-10-05;
# older downloads of this file predate that and need re-fetching. Q8_0 over Q4_K_M: 2 points more
# acceptance, and a draft step is dominated by the output projection, which is cheaper at 8 bits.
spec-draft-model = /home/llama-cpp/.cache/huggingface/hub/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
# Depth 2. Depth 3 wins only under greedy benchmarking (57.4 vs 46.1 t/s median over 10 loads each);
# at the production sampler this preset actually serves (temp 1.0, top-k 20, top-p 0.95) it does not.
# Compare depths structurally rather than on t/s, which acceptance noise swamps (35-75% between
# otherwise identical runs): over 6 runs on one load each, depth 3 cost +19.8% per pass (113.3 vs
# 94.6 ms) to settle only +9.9% more tokens per pass (2.45 vs 2.23). Measured cleanly: +18.7 ms/pass
# per extra depth step, being one more batch-1 draft forward plus one more verify token of expert
# streaming - the split between those two is estimated, not measured. Treat the -8% as indicative,
# not decisive: it is one load per arm, inside the per-process mode spread this repo warns about, and
# an earlier 3-load comparison put depth 2 vs 3 at a wash (25.2 vs 25.4 t/s). Depth 4 was also a
# single-load result (-7% t/s), sitting at the bottom of the observed acceptance range rather than
# clearly below it. Benchmark at the sampler you serve, not at temp 0.
spec-draft-n-max = 2
spec-draft-ngl = all
spec-type = draft-mtp
split-mode = layer
# `tensor-split` divides by LAYER COUNT (49 slots: 48 blocks + output), and `n-cpu-moe` leaves the
# leading layers nearly weightless, so an even-looking split lands almost every heavy block on one
# card - 52,48 put 22 heavy blocks plus the output head on GPU 1 and OOMed. 80,20 gives GPU 0 layers
# 0-39 (39/49 < 0.80 <= 40/49), all of them expert-less at n-cpu-moe 40, and GPU 1 layers 40-47, the
# output head and the draft head. GPU 1 stays the lighter side because it also hosts the embedding
# model and Qwen3.5-2B, which pin `main-gpu = 1` and cost ~6 GiB whenever they are resident; it has
# 0.8 GiB spare with both resident. The split also places the MoE cache: it caches only host-expert
# layers on the GPU that owns them, so moving the boundary without moving n-cpu-moe with it puts
# whole-expert blocks on GPU 0 and leaves less VRAM for the cache.
tensor-split = 80,20
temp = 1.0
top-k = 20
top-p = 0.95
